version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supportpulse-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./supportpulse.db
      - ENVIRONMENT=production
    volumes:
      - ./data:/app/data
      - ./backend/model_artifacts:/app/backend/model_artifacts
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: supportpulse-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
